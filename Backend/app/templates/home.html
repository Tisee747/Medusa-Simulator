<!doctype html>
<!-- Waiting screen for the physical simulator station. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MEDUSA Algorithm Simulator</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="screen home-screen">
    <main class="shell home-layout home-layout-neutral">
        <section class="home-hero">
            <p class="eyebrow">MEDUSA LEARNING LAB</p>
            <h1>Learn coding by seeing it happen.</h1>
            <p class="hero-copy">Solve a problem, submit your code, and see what your code actually did in the simulator.</p>

            <div class="waiting-panel waiting-panel-neutral" role="status">
                <strong>PRESS START ON THE <span class="control-panel-name">CONTROL PANEL</span></strong>
                <span>The screen will open the difficulty selection for the next player.</span>
            </div>
        </section>
    </main>
</body>
</html>
